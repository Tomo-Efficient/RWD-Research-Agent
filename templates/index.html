<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RWD Research Agent · 临床研究智能体</title>
<meta name="description" content="从临床问题到可复现研究报告的 RWD 研究工作台：确认数据、选择方向、确认方案、运行分析、生成报告。">
<link rel="stylesheet" href="/static/app.css?v=24">
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a class="brand" href="#/" aria-label="RWD Research Agent">
        <span class="brand-mark">R</span>
        <span class="brand-name"><b>RWD Research Agent</b><span>clinical research workspace</span></span>
      </a>
      <div class="top-right">
        <span class="env-chip"><i></i>MIMIC-IV · 脓毒症 ICU</span>
        <button class="btn btn-sm btn-ghost" id="reset-app">重新开始</button>
      </div>
    </div>
  </header>

  <nav class="stepper hidden" id="stepper" aria-label="研究步骤">
    <div class="stepper-in"></div>
  </nav>

  <main id="app" aria-live="polite"></main>

  <div class="overlay" id="overlay" role="status" aria-live="polite">
    <div class="overlay-card">
      <div class="loader"></div>
      <b id="overlay-title">正在准备</b>
      <p id="overlay-sub"></p>
    </div>
  </div>
  <div class="toast" id="toast" role="alert"></div>

  <noscript>
    <div style="max-width:720px;margin:60px auto;padding:24px;font-family:sans-serif">
      这个工作台需要 JavaScript。请开启后刷新页面。
    </div>
  </noscript>

  <script src="/static/app.js?v=24"></script>
</body>
</html>
